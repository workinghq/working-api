name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Genereate Prisma files
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build
